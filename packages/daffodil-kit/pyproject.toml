[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daffodil-kit"
version = "0.1.0"
description = "Daffodil desktop kit daemon — screen, input, recording, and file access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "mss>=9.0",
    "pillow>=10.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
native = ["maturin>=1.7"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "daffodil_kit_native"
python-source = "."
features = ["pyo3/extension-module"]

[project.scripts]
daffodil-kit = "daffodil_kit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daffodil_kit*"]
