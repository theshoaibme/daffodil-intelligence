[package]
name = "daffodil_kit_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "daffodil_kit_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-encoder = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
