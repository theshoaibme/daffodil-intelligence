services:
  # ──────────────────────────────────────────────────────────────
  # Frontend — Static Site (free tier, global CDN, auto HTTPS)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: daffodil-intelligence-web
    runtime: static
    repo: https://github.com/the-shoaib2/daffodil-intelligence
    branch: main
    rootDir: apps/web
    buildCommand: cd ../.. && npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile --filter daffodil-web... && pnpm --filter daffodil-web build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        # Update this after deploying your FastAPI backend
        value: https://daffodil-intelligence-api.onrender.com
      - key: VITE_WS_URL
        value: wss://daffodil-intelligence-api.onrender.com

  # ──────────────────────────────────────────────────────────────
  # Backend — Web Service (Docker runtime)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: daffodil-intelligence-api
    runtime: docker
    repo: https://github.com/the-shoaib2/daffodil-intelligence
    branch: main
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        generateValue: true 
      - key: APP_SECRET_KEY
        generateValue: true  # Generates a random secure secret
      - key: JWT_SECRET
        generateValue: true
      - key: USE_MOCK_DATA
        value: "false"
      - key: REDIS_URL
        value: ""  # Keeps Redis disabled, falling back to memory queue

