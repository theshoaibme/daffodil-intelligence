name: CopyCat Kit CI/CD

on:
  push:
    branches: [main, master]
    tags: ["copycat-v*"]
    paths:
      - "install"
      - "install.ps1"
      - "packages/daffodil-kit/**"
      - ".github/workflows/copycat-kit.yml"
  pull_request:
    paths:
      - "install"
      - "install.ps1"
      - "packages/daffodil-kit/**"
      - ".github/workflows/copycat-kit.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version bump (e.g. 0.1.1) — opens PR artifacts only, no auto-push"
        required: false

permissions:
  contents: write

env:
  PACKAGE_DIR: packages/daffodil-kit
  PYTHON_VERSION: "3.12"

jobs:
  version-check:
    name: Version sync
    if: ${{ !startsWith(github.ref, 'refs/tags/copycat-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches all manifests
        run: |
          V=$(tr -d '[:space:]' < packages/daffodil-kit/VERSION)
          P=$(grep -E '^version = ' packages/daffodil-kit/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          I=$(grep -E '^__version__ = ' packages/daffodil-kit/daffodil_kit/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          C=$(grep -E '^version = ' packages/daffodil-kit/native/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$V pyproject=$P __init__=$I cargo=$C"
          test "$V" = "$P"
          test "$V" = "$I"
          test "$V" = "$C"

  lint:
    name: Lint
    needs: version-check
    if: ${{ always() && (needs.version-check.result == 'success' || needs.version-check.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Lint security modules + tests
        run: |
          ruff check \
            packages/daffodil-kit/tests \
            packages/daffodil-kit/daffodil_kit/security.py \
            packages/daffodil-kit/daffodil_kit/audit.py \
            packages/daffodil-kit/daffodil_kit/copycat_guard.py \
            packages/daffodil-kit/daffodil_kit/vault.py \
            packages/daffodil-kit/daffodil_kit/input_lock.py
          ruff format --check packages/daffodil-kit/tests

  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    needs: version-check
    if: ${{ always() && (needs.version-check.result == 'success' || needs.version-check.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev tools
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -e "${{ env.PACKAGE_DIR }}[dev]" pytest-cov

      - name: Run full test suite
        shell: bash
        run: |
          cd "${{ env.PACKAGE_DIR }}"
          python -m pytest tests/ -v --tb=short --cov=daffodil_kit --cov-report=xml

      - name: Upload coverage (Ubuntu py3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: packages/daffodil-kit/coverage.xml
          fail_ci_if_error: false

      - name: CLI smoke test
        shell: bash
        run: |
          daffodil-kit version
          daffodil-kit status

  install-linux:
    name: install e2e (Linux)
    needs: [lint, test]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run universal install (local mode)
        run: |
          export DAFFODIL_KIT_USE_LOCAL=1
          export DAFFODIL_KIT_PREFIX="$HOME/.local"
          sh install

      - name: Run verify-install.sh
        run: |
          export PATH="$HOME/.local/daffodil-kit-venv/bin:$PATH"
          bash packages/daffodil-kit/scripts/verify-install.sh

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-linux
          path: ~/.daffodil-kit/logs/install-*.log
          if-no-files-found: ignore

  install-macos:
    name: install e2e (macOS)
    needs: [lint, test]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run universal install (local mode)
        run: |
          export DAFFODIL_KIT_USE_LOCAL=1
          export DAFFODIL_KIT_PREFIX="$HOME/.local"
          sh install

      - name: Verify
        run: |
          export PATH="$HOME/.local/daffodil-kit-venv/bin:$PATH"
          bash packages/daffodil-kit/scripts/verify-install.sh

  install-windows:
    name: install.ps1 e2e (Windows)
    needs: [lint, test]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run install.ps1 (local mode)
        shell: pwsh
        env:
          DAFFODIL_KIT_USE_LOCAL: "1"
        run: |
          & ./install.ps1

      - name: Verify CLI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.local\daffodil-kit-venv\Scripts;" + $env:PATH
          daffodil-kit version
          daffodil-kit status

  build-release:
    name: Build & release
    needs: [install-linux, install-macos, install-windows]
    if: startsWith(github.ref, 'refs/tags/copycat-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version from tag
        run: |
          TAG="${GITHUB_REF_NAME#copycat-v}"
          echo "$TAG" > packages/daffodil-kit/VERSION
          bash packages/daffodil-kit/scripts/sync-version.sh

      - name: Final test gate
        run: |
          pip install -e packages/daffodil-kit[dev] pytest-cov
          cd packages/daffodil-kit && pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build packages/daffodil-kit --outdir dist/

      - name: SHA256 checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install
            install.ps1
            packages/daffodil-kit/install
            packages/daffodil-kit/install.py
            packages/daffodil-kit/install.sh
            packages/daffodil-kit/install.ps1
            packages/daffodil-kit/install.cmd
            packages/daffodil-kit/scripts/verify-install.sh
            packages/daffodil-kit/VERSION
            packages/daffodil-kit/install.html
            packages/daffodil-kit/INSTALL.md
          generate_release_notes: true

  version-bump-artifact:
    name: Version bump preview
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump VERSION (artifact only)
        run: |
          echo "${{ github.event.inputs.version }}" > packages/daffodil-kit/VERSION
          bash packages/daffodil-kit/scripts/sync-version.sh
          git diff
      - uses: actions/upload-artifact@v4
        with:
          name: version-bump-${{ github.event.inputs.version }}
          path: |
            packages/daffodil-kit/VERSION
            packages/daffodil-kit/pyproject.toml
            packages/daffodil-kit/daffodil_kit/__init__.py
            packages/daffodil-kit/native/Cargo.toml
